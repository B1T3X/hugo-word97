<p class="doc__meta">
  {{- if not .Date.IsZero }}
  <span>Published <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time></span>
  {{- if and (not .Lastmod.IsZero) (ne (.Lastmod.Format "2006-01-02") (.Date.Format "2006-01-02")) }}
  <span class="doc__meta-sep" aria-hidden="true">&middot;</span>
  <span>Updated <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod | time.Format ":date_long" }}</time></span>
  {{- end }}
  <span class="doc__meta-sep" aria-hidden="true">&middot;</span>
  {{- end }}
  <span>{{ .ReadingTime }} min read</span>
</p>
