{{- /* Window title bar. Params: page, title, (optional) dialog */ -}}
<div class="titlebar" id="titlebar">
  <span class="titlebar__icon">{{ partial "w97/icon.html" (dict "name" "word") }}</span>
  <span class="titlebar__title" id="titlebar-title">{{ .title }} - Microsoft Word</span>
  <div class="titlebar__controls">
    <button type="button" class="tbtn" data-action="minimize" aria-label="Minimize" data-tip="Minimize">
      <svg width="8" height="7" viewBox="0 0 8 7" aria-hidden="true" focusable="false"><path d="M1 5h6v2H1z"/></svg>
    </button>
    <button type="button" class="tbtn" data-action="maximize" aria-label="Restore" aria-pressed="true" data-tip="Restore">
      <svg class="glyph-restore" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true" focusable="false"><path d="M2 0h6v5H7V2H3V1H2zM0 3h6v5H0zm1 2v2h4V5z"/></svg>
      <svg class="glyph-max" width="9" height="8" viewBox="0 0 9 8" aria-hidden="true" focusable="false"><path d="M0 0h9v8H0zm1 2v5h7V2z"/></svg>
    </button>
    <button type="button" class="tbtn tbtn--close" data-action="close" aria-label="Close" data-tip="Close">
      <svg width="8" height="7" viewBox="0 0 8 7" aria-hidden="true" focusable="false"><path d="M0 0h2v1h1v1h2V1h1V0h2v1H7v1H6v1H5v1h1v1h1v1h1v1H6V6H5V5H3v1H2v1H0V6h1V5h1V4h1V3H2V2H1V1H0z"/></svg>
    </button>
  </div>
</div>
